services:
  restaurant-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurant-ui
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Uncomment for development with volume mounting
    # volumes:
    #   - ./src:/app/src
    #   - /app/node_modules

networks:
  restaurant-network:
    driver: bridge
